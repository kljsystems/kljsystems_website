<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Render PC frames</title>
<style>html,body{margin:0;background:#000} #stage{position:relative;width:var(--w,1600px);height:var(--h,1000px)} #stage canvas{position:absolute;inset:0;width:100%;height:100%}</style>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.style.setProperty('--w', (q.get('w') || 1600) + 'px');
  document.documentElement.style.setProperty('--h', (q.get('h') || 1000) + 'px');
  window.KLJ_RENDER = true;
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"><canvas id="pc3d"></canvas><div id="pc3d-labels"></div><button id="pc3d-toggle" hidden></button></div>
<script type="module" src="pc3d.js"></script>
</body>
</html>
